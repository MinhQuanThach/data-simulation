name: ${COMPOSE_PROJECT_NAME:-bronze-silver-lab}

x-runtime: &runtime
  image: bronze-silver-runtime:day1
  platform: linux/amd64
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/lab/src:ro
    - ./scripts:/opt/lab/scripts:ro
    - ./sql:/opt/lab/sql:ro
    - ./config:/opt/lab/config:ro
    - ./fixtures:/opt/lab/fixtures:ro
    - airflow-logs:/opt/airflow/logs
    - airflow-auth:/opt/airflow/auth
  networks: [lab]

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-lab_admin}:admin
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__PARALLELISM: "1"
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Run python scripts/init-env.py}
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Run python scripts/init-env.py}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET:?Run python scripts/init-env.py}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"
  AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "10"
  AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
  AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
  AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type":"spark","host":"spark://spark-master","port":7077}'

x-lab-env: &lab-env
  LAB_DB_HOST: lab-db
  LAB_DB_PORT: "5432"
  LAB_DB_NAME: ${LAB_DB_NAME:-lab}

services:
  airflow-db:
    image: postgres:16.15-bookworm@sha256:cf5d353f55240ecc2f811827a15c7d1f2d562f08019b49dca12b5a59f4ab5962
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Generate .env first}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes: [airflow-db:/var/lib/postgresql/data]
    networks: [lab]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  lab-db:
    image: postgres:16.15-bookworm@sha256:cf5d353f55240ecc2f811827a15c7d1f2d562f08019b49dca12b5a59f4ab5962
    environment:
      POSTGRES_USER: ${LAB_ADMIN_USER}
      POSTGRES_PASSWORD: ${LAB_ADMIN_PASSWORD:?Generate .env first}
      POSTGRES_DB: ${LAB_DB_NAME}
    volumes: [lab-db:/var/lib/postgresql/data]
    networks: [lab]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  volumes-init:
    <<: *runtime
    user: "0:0"
    entrypoint: [/bin/bash, -c]
    command:
      - 'mkdir -p /opt/airflow/logs /opt/airflow/auth /opt/spark/work; chown ${AIRFLOW_UID:-50000}:0 /opt/airflow/logs /opt/airflow/auth /opt/spark/work'
    volumes:
      - airflow-logs:/opt/airflow/logs
      - airflow-auth:/opt/airflow/auth
      - spark-work:/opt/spark/work

  lab-init:
    <<: *runtime
    entrypoint: [/usr/local/bin/python, /opt/lab/scripts/init-lab.py]
    environment:
      <<: *lab-env
      LAB_ADMIN_DB_USER: ${LAB_ADMIN_USER}
      LAB_ADMIN_DB_PASSWORD: ${LAB_ADMIN_PASSWORD}
      CRAWLER_DB_USER: ${CRAWLER_DB_USER}
      CRAWLER_DB_PASSWORD: ${CRAWLER_DB_PASSWORD}
      SPARK_DB_USER: ${SPARK_DB_USER}
      SPARK_DB_PASSWORD: ${SPARK_DB_PASSWORD}
      PUBLISHER_DB_USER: ${PUBLISHER_DB_USER}
      PUBLISHER_DB_PASSWORD: ${PUBLISHER_DB_PASSWORD}
      OBSERVER_DB_USER: ${OBSERVER_DB_USER}
      OBSERVER_DB_PASSWORD: ${OBSERVER_DB_PASSWORD}
    depends_on:
      lab-db: {condition: service_healthy}

  airflow-init:
    <<: *runtime
    entrypoint: [/usr/local/bin/python, /opt/lab/scripts/init-airflow.py]
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    depends_on:
      airflow-db: {condition: service_healthy}
      volumes-init: {condition: service_completed_successfully}

  airflow-api-server:
    <<: *runtime
    command: [api-server, --workers, "1"]
    environment: *airflow-env
    ports: ["127.0.0.1:${AIRFLOW_UI_PORT:-8080}:8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/api/v2/monitor/health]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  airflow-scheduler:
    <<: *runtime
    command: [scheduler]
    environment:
      <<: [*airflow-env, *lab-env]
      CRAWLER_DB_USER: ${CRAWLER_DB_USER}
      CRAWLER_DB_PASSWORD: ${CRAWLER_DB_PASSWORD}
      SPARK_DB_USER: ${SPARK_DB_USER}
      SPARK_DB_PASSWORD: ${SPARK_DB_PASSWORD}
      PUBLISHER_DB_USER: ${PUBLISHER_DB_USER}
      PUBLISHER_DB_PASSWORD: ${PUBLISHER_DB_PASSWORD}
    depends_on:
      airflow-api-server: {condition: service_healthy}
      lab-init: {condition: service_completed_successfully}
      spark-worker: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8974/health]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  airflow-dag-processor:
    <<: *runtime
    command: [dag-processor]
    environment: *airflow-env
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 20s
      timeout: 20s
      retries: 20
      start_period: 30s

  spark-master:
    <<: *runtime
    entrypoint: [/opt/spark/bin/spark-class]
    command: [org.apache.spark.deploy.master.Master, --host, spark-master, --port, "7077", --webui-port, "8080"]
    environment:
      SPARK_DAEMON_MEMORY: 256m
      SPARK_MASTER_OPTS: -Dspark.master.rest.enabled=false
    ports: ["127.0.0.1:${SPARK_MASTER_UI_PORT:-8081}:8080"]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/json/]
      interval: 10s
      timeout: 5s
      retries: 20

  spark-worker:
    <<: *runtime
    entrypoint: [/opt/spark/bin/spark-class]
    command: [org.apache.spark.deploy.worker.Worker, --host, spark-worker, --cores, "2", --memory, 2g, --webui-port, "8081", --work-dir, /opt/spark/work, "spark://spark-master:7077"]
    environment:
      SPARK_DAEMON_MEMORY: 256m
    volumes:
      - ./src:/opt/lab/src:ro
      - spark-work:/opt/spark/work
    ports: ["127.0.0.1:${SPARK_WORKER_UI_PORT:-8082}:8081"]
    depends_on:
      spark-master: {condition: service_healthy}
      volumes-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, 'import json,urllib.request; s=json.load(urllib.request.urlopen("http://spark-master:8080/json/",timeout=5)); assert any(w["state"]=="ALIVE" and w["host"]=="spark-worker" for w in s["workers"])']
      interval: 10s
      timeout: 10s
      retries: 20

networks:
  lab:
    driver: bridge
volumes:
  airflow-db:
  lab-db:
  airflow-logs:
  airflow-auth:
  spark-work:
